<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ANZ Agri Crop Sciences — quality hybrid and open-pollinated vegetable seeds. Trusted plant genetics R&D since 2009."
    />
    <title>ANZ Agri Crop Sciences — Quality Seeds, Trusted Genetics</title>
  </head>
  <body>
    <script>
      // Companion to public/404.html's GitHub Pages SPA redirect trick:
      // restore the originally-requested deep link so react-router can render it.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
